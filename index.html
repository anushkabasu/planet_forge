<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars-layer"></div>

  <header class="app-header">
    <h1 class="app-title">Planet Forge</h1>
    <p class="app-subtitle">Design worlds, one feature at a time!</p>
  </header>

  <main class="app-layout">

    <aside class="panel sidebar-left">
      <h2 class="panel-title">Controls</h2>

      <div class="control-group">
        <label for="size-slider">Planet Size</label>
        <input type="range" id="size-slider" min="100" max="300" value="220">
      </div>

      <div class="control-group">
        <label for="color-picker">Planet Color</label>
        <input type="color" id="color-picker" value="#5b8cff">
      </div>

      <div class="control-group">
        <label for="atmosphere-toggle">Atmosphere</label>
        <input type="checkbox" id="atmosphere-toggle">
      </div>

      <div class="control-group">
        <label for="ring-toggle">Rings</label>
        <input type="checkbox" id="ring-toggle">
      </div>

      <div class="control-group">
        <label for="moon-slider">Moons</label>
        <input type="range" id="moon-slider" min="0" max="3" value="0" step="1">
      </div>

      <p class="placeholder-text">Customization tools, such as terrain and atmosphere controls, will be in future updates!</p>
    </aside>

    <section class="panel preview-panel">
      <h2 class="panel-title">Planet Preview</h2>
      <div class="preview-stage">
        <div class="preview-stars">
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
        </div>

        <div class="planet-system" id="planet-system">
          <div class="ring" id="ring"></div>
          <div class="planet" id="planet"></div>
          <div class="moon" id="moon-1"></div>
          <div class="moon" id="moon-2"></div>
          <div class="moon" id="moon-3"></div>
        </div>
      </div>
    </section>

    <aside class="panel sidebar-right">
      <h2 class="panel-title">Planet Information</h2>
      
      <div class="info-row">
        <span class="info-label">Name</span>
        <span class="info-value" id="info-name">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Type</span>
        <span class="info-value" id="info-type">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Gravity</span>
        <span class="info-value" id="info-gravity">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Average Temperature</span>
        <span class="info-value" id="info-atmosphere">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Atmosphere</span>
        <span class="info-value" id="info-atmosphere">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Habitability</span>
        <span class="info-value" id="info-habitability">-</span>
      </div>

      <p class="placeholder-text">Wait for future updates!</p>
    </aside>

  </main>

  <script src="script.js"></script>
</body>
</html>
